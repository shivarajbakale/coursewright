# One origin for the whole app. All three services share the Tailscale node's network, so the agent
# (8123) and the tutor runtime (4000) are on localhost.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  client_max_body_size 25m;

  # Tutor chat: streamed, so no buffering and long reads.
  location /api/copilotkit {
    proxy_pass http://127.0.0.1:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
  }

  # REST API and the build's live event stream (SSE).
  location /api/ {
    proxy_pass http://127.0.0.1:8123;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
  }

  # Hashed assets never change; everything else falls back to the SPA.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
