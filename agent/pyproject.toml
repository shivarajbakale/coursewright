[project]
name = "coursewright-agent"
version = "0.1.0"
description = "Coursewright agent service: REST API, tutor over AG-UI, course builder jobs"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ag-ui-langgraph==0.0.47",
    "aiosqlite>=0.22.1",
    "anthropic>=2.5.0",
    "copilotkit==0.1.96",
    "deepagents>=0.7,<0.8",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "langchain-anthropic>=1.7,<1.8",
    "langgraph>=1.2.20",
    "langgraph-checkpoint-sqlite>=3.1,<3.2",
    "mcp>=1.20",
    "pydantic>=2",
    "sqlite-vec==0.1.9",
    "sse-starlette>=3.6.0",
    "uvicorn[standard]>=0.54.0",
    "voyageai>=0.5,<0.6",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
