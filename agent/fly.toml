# Fly.io config for the agent service. One machine with a volume at /data (SQLite + job folders); the
# in-process job worker means it must stay running (no auto-stop) and must not be scaled past one machine.
#   fly launch --no-deploy --copy-config      (pick your own app name)
#   fly volumes create cw_data --size 3
#   fly secrets set ANTHROPIC_API_KEY=... VOYAGE_API_KEY=... CW_SHARED_SECRET=... \
#     LITESTREAM_BUCKET=... LITESTREAM_PATH=coursewright LITESTREAM_ENDPOINT=... LITESTREAM_REGION=auto \
#     LITESTREAM_ACCESS_KEY_ID=... LITESTREAM_SECRET_ACCESS_KEY=...
#   fly deploy
app = "coursewright-agent"
primary_region = "iad"
kill_signal = "SIGTERM"
kill_timeout = "30s"

[build]
  dockerfile = "Dockerfile"

[env]
  CW_DB_PATH = "/data/coursewright.db"

[[mounts]]
  source = "cw_data"
  destination = "/data"

[http_service]
  internal_port = 8123
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 50
    hard_limit = 100

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/api/health"

[[vm]]
  size = "shared-cpu-2x"
  memory = "2gb"
